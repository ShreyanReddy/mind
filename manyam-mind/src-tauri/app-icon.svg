<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Prayan app icon — original artwork. A living mind-graph: one bright
       hub neuron with strengthening synapses, on the brand charcoal.
       Colors mirror src/styles/brand.css: ink #1e1e1e, glow-syn #a882ff,
       glow-mind #7f6df2, paper #dcddde. -->
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#2c2a38"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9b2ff"/>
      <stop offset="55%" stop-color="#a882ff"/>
      <stop offset="100%" stop-color="#7f6df2"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g stroke-linecap="round" fill="none">
    <path d="M512 512 L268 340" stroke="#7f6df2" stroke-width="26" opacity="0.85"/>
    <path d="M512 512 L748 306" stroke="#a882ff" stroke-width="34" opacity="0.9"/>
    <path d="M512 512 L716 726" stroke="#7f6df2" stroke-width="22" opacity="0.7"/>
    <path d="M512 512 L292 700" stroke="#a882ff" stroke-width="18" opacity="0.55"/>
    <path d="M268 340 L748 306" stroke="#7f6df2" stroke-width="12" opacity="0.35"/>
    <path d="M716 726 L748 306" stroke="#a882ff" stroke-width="10" opacity="0.3"/>
  </g>
  <circle cx="512" cy="512" r="118" fill="url(#hub)"/>
  <circle cx="512" cy="512" r="150" fill="none" stroke="#a882ff" stroke-width="8" opacity="0.35"/>
  <circle cx="268" cy="340" r="62" fill="#7f6df2"/>
  <circle cx="748" cy="306" r="78" fill="#a882ff"/>
  <circle cx="716" cy="726" r="54" fill="#7f6df2" opacity="0.9"/>
  <circle cx="292" cy="700" r="42" fill="#a882ff" opacity="0.75"/>
  <circle cx="748" cy="306" r="26" fill="#dcddde" opacity="0.9"/>
  <circle cx="512" cy="512" r="44" fill="#dcddde" opacity="0.95"/>
</svg>
