# Desktop bundles (PLAN.md §6.1) — built on demand or on a version tag, not on
# every push: a three-OS Tauri build is slow and only needed for releases.
# CI correctness for the Rust shell is still covered on every push by the
# `desktop-check` job in ci.yml (cargo check on Linux).
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: manyam-mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manyam-mind/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: manyam-mind/src-tauri

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm ci

      - name: Build desktop bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: prayan-${{ matrix.os }}
          path: |
            manyam-mind/src-tauri/target/release/bundle/**/*.deb
            manyam-mind/src-tauri/target/release/bundle/**/*.AppImage
            manyam-mind/src-tauri/target/release/bundle/**/*.rpm
            manyam-mind/src-tauri/target/release/bundle/**/*.dmg
            manyam-mind/src-tauri/target/release/bundle/**/*.app.tar.gz
            manyam-mind/src-tauri/target/release/bundle/**/*.msi
            manyam-mind/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
